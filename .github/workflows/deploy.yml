name: Deploy celtuc

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      todo:
        description: Reconstruir todo (ignorar el rebuild selectivo)
        type: boolean
        default: false

# Si llega un push mas nuevo mientras hay un deploy corriendo, ESPERA a que
# termine: cancelar a mitad de un up -d deja imagenes reemplazadas a medias.
concurrency:
  group: deploy-celtuc
  cancel-in-progress: false

env:
  APP_DIR: /var/www/celtuc

jobs:
  deploy:
    name: Deploy a produccion
    runs-on: [self-hosted, celtuc]

    steps:
      - name: Traer los cambios
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          git fetch --prune origin main
          git reset --hard origin/main

      - name: Desplegar
        working-directory: ${{ env.APP_DIR }}
        env:
          # Para el seguimiento de deploys en vivo del panel interno.
          PANEL_INGEST_TOKEN: ${{ secrets.PANEL_INGEST_TOKEN }}
        run: |
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh ${{ inputs.todo && '--all' || '' }}

      - name: Estado final
        if: always()
        working-directory: ${{ env.APP_DIR }}
        run: docker compose ps
