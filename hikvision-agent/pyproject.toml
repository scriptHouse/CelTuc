[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hikvision-agent"
version = "1.0.0"
description = "Agente local Windows: sincroniza fichadas del reloj Hikvision DS-K1A340WX con el backend CelTuc"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pyinstaller>=6.6",
]

[project.scripts]
hikvision-agent = "hikvision_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
